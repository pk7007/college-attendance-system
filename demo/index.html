<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153b53"><title>CampusAttend · College Attendance</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#203b4b;background:#f3f6f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.login-page{min-height:100vh;display:grid;grid-template-columns:1fr 430px;max-width:1200px;margin:auto;align-items:center;padding:36px;gap:8vw}.intro{padding:5vw 0}.brand{font-weight:800;letter-spacing:-.5px;color:#193f55;font-size:20px}.brand i{font-style:normal;color:#3c9a83}.mark{display:inline-grid;place-items:center;background:#347c78;color:white;width:34px;height:34px;border-radius:10px;margin-right:8px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:#328878;font-weight:800;margin:0 0 14px}.intro h1{font-size:clamp(42px,6vw,68px);letter-spacing:-3px;line-height:1.02;margin:28px 0 18px;color:#173b50}.intro p{line-height:1.7;color:#72858c;max-width:470px}.card{background:white;border:1px solid #e4ebea;border-radius:16px;padding:28px;box-shadow:0 12px 40px #254b5810}.card h2{margin:8px 0;font-size:24px}.muted{color:#829197;font-size:13px;line-height:1.6}.field{display:grid;gap:7px;font-size:12px;color:#516770;font-weight:650;margin:15px 0}.field input,.field select,input,select{height:42px;border:1px solid #dce5e3;border-radius:8px;padding:0 11px;background:white;color:#203b4b}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:700;font-size:12px}.primary{background:#227f76;color:white}.secondary{background:#eaf2f0;color:#31685e}.quiet{background:transparent;color:#637982}.danger{background:#fff0ec;color:#ab4c34}.full{width:100%;margin-top:6px}.demo-logins{border-top:1px solid #eaf0ef;padding-top:15px;margin-top:20px;display:grid;gap:8px}.demo-row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px}.demo-row button{font-size:11px}.note{font-size:11px;color:#839197;line-height:1.5;margin:14px 0 0}.app{max-width:1200px;margin:auto;padding:0 26px 36px}.topbar{height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5ecea}.topbar .brand{font-size:18px}.user-tools{display:flex;gap:12px;align-items:center;font-size:12px}.pill{border-radius:99px;background:#e4f1ec;color:#317666;padding:6px 10px;font-size:10px;font-weight:800;text-transform:lowercase}.content{padding:28px 0}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:21px}.heading h1{font-size:30px;letter-spacing:-1.2px;margin:3px 0}.heading p{margin:5px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:white;border:1px solid #e2e9e8;border-radius:12px;padding:18px}.metric span{font-size:10px;color:#809197;text-transform:uppercase;letter-spacing:.7px;font-weight:750}.metric strong{display:block;font-size:29px;margin:10px 0 3px;color:#244a5c}.metric small{color:#89979b;font-size:10px}.panel{margin-top:16px;background:white;border:1px solid #e2e9e8;border-radius:12px;padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel h2{font-size:17px;margin:0}.panel h3{font-size:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}.tab{border:0;background:#eaf0ef;padding:9px 12px;border-radius:8px;color:#557078;font-size:11px;font-weight:700}.tab.active{background:#1f4d60;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#809197;font-size:10px;text-transform:uppercase;letter-spacing:.5px}td,th{padding:12px 10px;border-bottom:1px solid #edf1f0}td{color:#36505c}.badge{padding:5px 8px;border-radius:99px;font-size:10px;font-weight:750;background:#eef3f2}.present{color:#1b806b;background:#e8f5ef}.absent{color:#a74a42;background:#fff0ed}.late{color:#9a6c1e;background:#fff6e2}.form-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.form-row .field{min-width:160px;flex:1}.roster{display:grid}.roster-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #eef2f1}.person{display:grid;gap:3px}.person small{font-size:10px;color:#88969a}.marks{display:flex;gap:5px}.mark-btn{border:1px solid #e2e9e7;background:white;border-radius:7px;padding:7px 9px;font-size:10px}.mark-btn.selected.present{border-color:#66ae98;background:#e8f5ef}.mark-btn.selected.absent{border-color:#d6978d;background:#fff0ed}.mark-btn.selected.late{border-color:#d9b66c;background:#fff6e2}.alert{background:#fff6e2;color:#74531b;padding:11px 13px;border-radius:8px;font-size:12px;margin:12px 0}.success{background:#e9f5ef;color:#216b59}.empty{padding:28px;text-align:center;color:#829197;font-size:12px}.actions{display:flex;gap:8px;align-items:center}.footer{text-align:center;padding:23px;color:#89979b;font-size:10px}.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.subcard{border:1px solid #e5ecea;border-radius:9px;padding:13px}.subcard b{font-size:12px}.subcard small{display:block;color:#819095;margin-top:7px}.progress{height:6px;background:#edf1f0;border-radius:9px;margin-top:11px;overflow:hidden}.progress i{display:block;height:100%;background:#328e7c;border-radius:9px}.login-error{font-size:12px;color:#a44337;margin:9px 0}.filter{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.filter label{font-size:11px;color:#657b82;display:grid;gap:6px}.filter input,.filter select{min-width:145px}
@media(max-width:800px){.login-page{grid-template-columns:1fr;padding:24px;gap:10px}.intro{padding:18px 0}.intro h1{font-size:48px}.card{max-width:520px;width:100%;margin:0 auto}.grid{grid-template-columns:repeat(2,1fr)}.app{padding:0 14px 24px}.topbar{height:65px}.subgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.user-name{display:none}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:26px}.grid{gap:8px}.metric{padding:13px}.metric strong{font-size:24px}.panel{padding:14px}.roster-item{align-items:flex-start;flex-direction:column}.marks{margin-left:auto}.subgrid{grid-template-columns:1fr}.login-page{padding:17px}.intro h1{font-size:40px}.demo-row{align-items:flex-start}}
</style>
</head>
<body><div id="root"></div>
<script>
(()=>{
const STORAGE='campusattend-simple-demo-v1';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());
const seed=()=>({users:[{id:1,name:'Avery Morgan',email:'admin@college.test',role:'ADMIN',active:true},{id:2,name:'Jordan Lee',email:'faculty@college.test',role:'FACULTY',active:true},{id:3,name:'Sam Patel',email:'student@college.test',role:'STUDENT',active:true},{id:4,name:'Maya Chen',email:'maya@college.test',role:'STUDENT',active:true},{id:5,name:'Noah Williams',email:'noah@college.test',role:'STUDENT',active:true},{id:6,name:'Priya Shah',email:'priya@college.test',role:'STUDENT',active:true}],classes:[{id:1,course:'Computer Science',section:'CS-2A',subject:'Data Structures',code:'CS201'}],sessions:[{id:1,date:'2026-11-03',label:'Lecture 1',classId:1,marks:{3:'PRESENT',4:'PRESENT',5:'LATE',6:'ABSENT'}},{id:2,date:'2026-11-04',label:'Lecture 2',classId:1,marks:{3:'PRESENT',4:'ABSENT',5:'PRESENT',6:'PRESENT'}}],nextId:7});
let db;try{db=JSON.parse(localStorage.getItem(STORAGE))||seed()}catch{db=seed()};let user=(()=>{try{const id=Number(sessionStorage.getItem('campusattend-user'));return db.users.find(u=>u.id===id&&u.active)||null}catch{return null}})();let view='overview',selectedClass=1,marks={},toast='';
const save=()=>localStorage.setItem(STORAGE,JSON.stringify(db));const root=document.getElementById('root');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const roleLabel=r=>r[0]+r.slice(1).toLowerCase();const students=()=>db.users.filter(u=>u.role==='STUDENT'&&u.active);const sessionsForStudent=id=>db.sessions.filter(s=>s.marks[id]&&s.state!=='CANCELLED');const percent=id=>{const a=sessionsForStudent(id);return a.length?Math.round(a.filter(s=>['PRESENT','LATE'].includes(s.marks[id])).length/a.length*100):null};const markClass=x=>String(x||'').toLowerCase();
function login(){root.innerHTML=`<main class="login-page"><section class="intro"><div class="brand"><span class="mark">C</span>Campus<i>Attend</i></div><p class="eyebrow" style="margin-top:72px">COLLEGE ATTENDANCE</p><h1>Make every class count.</h1><p>A simple campus attendance demo. Sign in to explore admin setup, faculty attendance, and student progress. Demo records stay in this browser.</p><p class="muted">No server or database required · Runs offline after opening</p></section><section class="card"><p class="eyebrow">WELCOME</p><h2>Sign in to explore</h2><p class="muted">Use one of the local demo accounts below.</p><form id="login"><label class="field">Email address<input name="email" type="email" required autocomplete="username" placeholder="you@college.test"></label><label class="field">Demo password<input name="password" type="password" required autocomplete="current-password" placeholder="demo123"></label><div id="login-error" class="login-error"></div><button class="btn primary full">Open demo workspace →</button></form><div class="demo-logins"><div class="demo-row"><span>Admin · admin@college.test</span><button class="btn secondary" data-login="admin@college.test">Use admin</button></div><div class="demo-row"><span>Faculty · faculty@college.test</span><button class="btn secondary" data-login="faculty@college.test">Use faculty</button></div><div class="demo-row"><span>Student · student@college.test</span><button class="btn secondary" data-login="student@college.test">Use student</button></div></div><p class="note">All demo accounts use password <b>demo123</b>. This is a local UI demo, not secure authentication. Do not enter real student data.</p></section></main>`;
root.querySelector('#login').onsubmit=e=>{e.preventDefault();const email=new FormData(e.currentTarget).get('email').toString().toLowerCase();const password=new FormData(e.currentTarget).get('password');const found=db.users.find(u=>u.email.toLowerCase()===email&&u.active);if(password!=='demo123'||!found){root.querySelector('#login-error').textContent='Use a demo account email and password demo123.';return}user=found;sessionStorage.setItem('campusattend-user',user.id);view='overview';render()};root.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>{root.querySelector('[name=email]').value=b.dataset.login;root.querySelector('[name=password]').value='demo123'})}
function header(){return `<header class="topbar"><div class="brand"><span class="mark">C</span>Campus<i>Attend</i></div><div class="user-tools"><span class="pill">${roleLabel(user.role)}</span><span class="user-name">${esc(user.name)}</span><button class="btn quiet" id="signout">Sign out</button></div></header>`}
function nav(){const items=user.role==='ADMIN'?[['overview','Overview'],['people','People'],['classes','Classes & subjects'],['reports','Reports']]:user.role==='FACULTY'?[['overview','Overview'],['attendance','Take attendance']]:[['overview','My attendance'],['history','History']];return `<nav class="tabs">${items.map(([id,label])=>`<button class="tab ${view===id?'active':''}" data-view="${id}">${label}</button>`).join('')}<button class="tab" id="reset">Reset sample data</button></nav>`}
function stat(label,value,detail){return `<article class="metric"><span>${label}</span><strong>${value}</strong><small>${detail}</small></article>`}
function admin(){const total=db.sessions.filter(s=>s.state!=='CANCELLED').length;return `<div class="heading"><div><p class="eyebrow">ADMIN WORKSPACE</p><h1>${view==='people'?'People':view==='classes'?'Classes & subjects':view==='reports'?'Attendance reports':'Campus overview'}</h1><p class="muted">Manage the demo college and review attendance activity.</p></div></div>${nav()}${view==='people'?peopleView():view==='classes'?classesView():view==='reports'?reportView():`<section class="grid">${stat('Students',students().length,'Active demo accounts')}${stat('Faculty',db.users.filter(u=>u.role==='FACULTY'&&u.active).length,'Assigned instructors')}${stat('Class sections',db.classes.length,'Available in demo')}${stat('Sessions recorded',total,'Completed class meetings')}</section><section class="panel"><div class="panel-head"><div><h2>Recent attendance</h2><p class="muted">Latest saved class sessions.</p></div><button class="btn secondary" data-view="reports">Open reports</button></div>${sessionTable(db.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</section>`}`}
function peopleView(){return `<section class="panel"><div class="panel-head"><div><h2>Add a student</h2><p class="muted">Add a demo account stored in this browser.</p></div></div><form id="add-person" class="form-row"><label class="field">Student name<input name="name" required placeholder="Alex Rivera"></label><label class="field">Email address<input name="email" type="email" required placeholder="alex@college.test"></label><button class="btn primary">Add student</button></form></section><section class="panel"><div class="panel-head"><h2>People</h2><span class="pill">${db.users.length} accounts</span></div>${table(['Name','Email','Role','Status'],db.users.map(u=>[esc(u.name),esc(u.email),roleLabel(u.role),u.active?'Active':'Inactive']))}</section>`}
function classesView(){return `<section class="panel"><div class="panel-head"><div><h2>Add a class</h2><p class="muted">Create a section and subject for attendance practice.</p></div></div><form id="add-class" class="form-row"><label class="field">Course<input name="course" required placeholder="Biology"></label><label class="field">Section<input name="section" required placeholder="BIO-1A"></label><label class="field">Subject<input name="subject" required placeholder="Cell Biology"></label><label class="field">Subject code<input name="code" required placeholder="BIO101"></label><button class="btn primary">Add class</button></form></section><section class="panel"><div class="panel-head"><h2>Classes & subjects</h2></div>${table(['Course','Section','Subject','Code','Faculty'],db.classes.map(c=>[esc(c.course),esc(c.section),esc(c.subject),esc(c.code),'Jordan Lee']))}<p class="note">Sample students are available for the starter CS-2A class. New classes are for exploring the admin interface.</p></section>`}
function sessionTable(rows){return rows.length?table(['Date','Class','Session','Present','Absent','Late'],rows.map(s=>{const c=db.classes.find(c=>c.id===s.classId)||db.classes[0];const vals=Object.values(s.marks||{});return [s.date,esc(c?.section||'—'),esc(s.label),vals.filter(x=>x==='PRESENT').length,vals.filter(x=>x==='ABSENT').length,vals.filter(x=>x==='LATE').length]})):`<div class="empty">No attendance sessions recorded yet.</div>`}
function reportView(){return `<section class="panel"><div class="panel-head"><div><h2>Session summary</h2><p class="muted">Export a CSV or print this report.</p></div><div class="actions"><button class="btn secondary" id="csv">Download CSV</button><button class="btn secondary" onclick="print()">Print</button></div></div>${sessionTable(db.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</section><section class="panel"><h2>Student attendance</h2>${table(['Student','Email','Sessions','Attendance'],students().map(s=>[esc(s.name),esc(s.email),sessionsForStudent(s.id).length,percent(s.id)===null?'—':percent(s.id)+'%']))}</section>`}
function faculty(){const c=db.classes.find(x=>x.id===selectedClass)||db.classes[0];const roster=students();const list=db.sessions.filter(s=>s.classId===c?.id).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="heading"><div><p class="eyebrow">FACULTY WORKSPACE</p><h1>Take attendance</h1><p class="muted">Open a class session and mark each student.</p></div></div>${nav()}${view==='overview'?`<section class="grid">${stat('Assigned classes',db.classes.length,'Demo faculty assignments')}${stat('Students',roster.length,'In your starter class')}${stat('Sessions',list.length,'Saved in this browser')}${stat('Today',today(),'Institution local date')}</section><section class="panel"><div class="panel-head"><h2>Your classes</h2><button class="btn primary" data-view="attendance">Take attendance</button></div>${table(['Course','Section','Subject','Students'],db.classes.map(x=>[esc(x.course),esc(x.section),esc(x.subject),roster.length]))}</section>`:`<section class="panel"><div class="panel-head"><div><h2>Class session</h2><p class="muted">Choose a class, date, and session label.</p></div></div><div class="form-row"><label class="field">Class<select id="class-select">${db.classes.map(x=>`<option value="${x.id}" ${x.id===selectedClass?'selected':''}>${esc(x.section)} · ${esc(x.subject)}</option>`)}</select></label><label class="field">Date<input id="session-date" type="date" value="${today()}"></label><label class="field">Session label<input id="session-label" value="Lecture ${list.length+1}" placeholder="Lecture 1"></label><button class="btn secondary" id="open-session">Open session</button></div><div id="roster-area">${rosterForm(c,roster)}</div><section class="panel" style="padding:14px 0 0;border:0"><h3>Saved sessions</h3>${sessionTable(list)}</section></section>`}`}
function rosterForm(c,roster){if(!c)return '<div class="empty">Add a class in the admin view first.</div>';if(!Object.keys(marks).length)marks=Object.fromEntries(roster.map(s=>[s.id,'']));return `<div class="roster">${roster.map(s=>`<div class="roster-item"><div class="person"><b>${esc(s.name)}</b><small>${esc(s.email)}</small></div><div class="marks">${['PRESENT','ABSENT','LATE'].map(m=>`<button class="mark-btn ${marks[s.id]===m?'selected '+markClass(m):''}" data-student="${s.id}" data-mark="${m}">${roleLabel(m)}</button>`).join('')}</div></div>`).join('')}</div><div class="panel-head" style="margin:15px 0 0"><span class="muted">All students must have one mark.</span><button class="btn primary" id="save-marks">Save attendance</button></div>`}
function student(){const mine=sessionsForStudent(user.id),pct=percent(user.id),present=mine.filter(s=>s.marks[user.id]==='PRESENT').length,late=mine.filter(s=>s.marks[user.id]==='LATE').length,absent=mine.filter(s=>s.marks[user.id]==='ABSENT').length;return `<div class="heading"><div><p class="eyebrow">STUDENT WORKSPACE</p><h1>Your attendance</h1><p class="muted">A clear picture of your class participation and progress.</p></div></div>${nav()}${view==='overview'?`<section class="grid">${stat('Overall attendance',pct===null?'—':pct+'%',`Across ${mine.length} completed sessions`)}${stat('Present',present,'Sessions marked present')}${stat('Late',late,'Counts as attended')}${stat('Absent',absent,'Sessions marked absent')}</section><section class="panel"><div class="panel-head"><div><h2>By subject</h2><p class="muted">Your record in each enrolled subject.</p></div></div><div class="subgrid">${db.classes.map(c=>{const xs=mine.filter(s=>s.classId===c.id),p=xs.length?Math.round(xs.filter(s=>['PRESENT','LATE'].includes(s.marks[user.id])).length/xs.length*100):null;return `<article class="subcard"><b>${esc(c.subject)}</b><small>${esc(c.code)} · ${xs.length} sessions</small><div class="progress"><i style="width:${p||0}%"></i></div><small>${p===null?'No marks yet':p+'% attendance'}</small></article>`}).join('')}</div></section>`:`<section class="panel"><div class="panel-head"><div><h2>Attendance history</h2><p class="muted">Your saved class session marks.</p></div></div>${table(['Date','Course','Subject','Session','Status'],mine.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>{const c=db.classes.find(x=>x.id===s.classId)||{};const m=s.marks[user.id];return [s.date,esc(c.course),esc(c.subject),esc(s.label),`<span class="badge ${markClass(m)}">${roleLabel(m)}</span>`]}))}</section>`}`}
function table(head,rows){return rows.length?`<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">No records to show yet.</div>`}
function render(){if(!user){login();return}root.innerHTML=`<div class="app">${header()}<main class="content">${user.role==='ADMIN'?admin():user.role==='FACULTY'?faculty():student()}</main><footer class="footer">CampusAttend · Browser-only demo · Data stays in this browser</footer></div>`;root.querySelector('#signout').onclick=()=>{user=null;sessionStorage.removeItem('campusattend-user');login()};root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;marks={};render()});const reset=root.querySelector('#reset');if(reset)reset.onclick=()=>{if(confirm('Reset all browser demo data to the sample records?')){db=seed();save();render()}};
const addPerson=root.querySelector('#add-person');if(addPerson)addPerson.onsubmit=e=>{e.preventDefault();const f=new FormData(addPerson),email=String(f.get('email')).trim().toLowerCase();if(db.users.some(u=>u.email.toLowerCase()===email)){alert('That email is already in the demo.');return}db.users.push({id:db.nextId++,name:String(f.get('name')).trim(),email,role:'STUDENT',active:true});save();render()};
const addClass=root.querySelector('#add-class');if(addClass)addClass.onsubmit=e=>{e.preventDefault();const f=new FormData(addClass);db.classes.push({id:db.nextId++,course:String(f.get('course')).trim(),section:String(f.get('section')).trim(),subject:String(f.get('subject')).trim(),code:String(f.get('code')).trim()});save();render()};
const csv=root.querySelector('#csv');if(csv)csv.onclick=()=>{const rows=[['Date','Section','Session','Present','Absent','Late'],...db.sessions.map(s=>{const c=db.classes.find(x=>x.id===s.classId)||{};const a=Object.values(s.marks||{});return[s.date,c.section,s.label,a.filter(x=>x==='PRESENT').length,a.filter(x=>x==='ABSENT').length,a.filter(x=>x==='LATE').length]})];const blob=new Blob([rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='attendance-demo.csv';a.click();URL.revokeObjectURL(a.href)};
const classSelect=root.querySelector('#class-select');if(classSelect)classSelect.onchange=()=>{selectedClass=Number(classSelect.value);marks={};render()};const open=root.querySelector('#open-session');if(open)open.onclick=()=>{const date=root.querySelector('#session-date').value,label=root.querySelector('#session-label').value.trim();if(!date||!label){alert('Choose a date and session label.');return}const existing=db.sessions.find(s=>s.classId===selectedClass&&s.date===date&&s.label===label);marks=existing?{...existing.marks}:Object.fromEntries(students().map(s=>[s.id,'']));root.querySelector('#roster-area').innerHTML=rosterForm(db.classes.find(x=>x.id===selectedClass),students());bindMarks();root.querySelector('#save-marks').onclick=()=>saveMarks(date,label)};if(open)bindMarks();}
function bindMarks(){root.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{marks[b.dataset.student]=b.dataset.mark;b.parentElement.querySelectorAll('button').forEach(x=>x.className='mark-btn');b.className=`mark-btn selected ${markClass(b.dataset.mark)}`});const save=root.querySelector('#save-marks');if(save)save.onclick=()=>{const date=root.querySelector('#session-date')?.value||today(),label=root.querySelector('#session-label')?.value.trim()||'Lecture';saveMarks(date,label)}}
function saveMarks(date,label){const roster=students();if(roster.some(s=>!marks[s.id])){alert('Mark every student before saving attendance.');return}let session=db.sessions.find(s=>s.classId===selectedClass&&s.date===date&&s.label===label);if(!session){session={id:db.nextId++,date,label,classId:selectedClass,marks:{}};db.sessions.push(session)}session.marks={...marks};session.state='COMPLETED';save();toast='Attendance saved';marks={};render()}
render();
})();
</script></body></html>
