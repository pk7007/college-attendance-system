<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusAttend</title><style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#233f50;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;font-size:12px;font-weight:700}.primary{background:#257d73;color:#fff}.secondary{background:#e7f0ed;color:#29675f}.quiet{background:transparent;color:#627a82}.wrap{max-width:1120px;margin:auto;padding:0 24px}.top{height:72px;border-bottom:1px solid #e1eae8;display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:800;color:#1c4256}.brand span{color:#338b7a}.user{display:flex;align-items:center;gap:12px;font-size:12px}.pill{background:#e5f1ec;color:#317566;border-radius:99px;padding:6px 10px;font-size:10px;font-weight:800;text-transform:lowercase}.content{padding:28px 0 48px}.login{min-height:100vh;display:grid;grid-template-columns:1fr 400px;align-items:center;gap:8vw;max-width:1050px;margin:auto;padding:36px}.login h1{font-size:56px;letter-spacing:-2px;color:#173d53;margin:20px 0 12px}.login p{color:#75878e;line-height:1.7}.card,.panel,.metric{background:white;border:1px solid #e1e9e7;border-radius:13px;padding:20px}.card{padding:28px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#358b78;font-weight:800}.field{display:grid;gap:7px;margin:13px 0;color:#536a73;font-size:12px;font-weight:650}.field input,.field select{height:40px;border:1px solid #dce5e2;border-radius:7px;padding:0 10px;background:#fff;color:#29495a}.full{width:100%}.error{background:#fff1ed;color:#a24035;padding:10px;border-radius:7px;font-size:12px}.success{background:#e7f5ee;color:#206752;padding:10px;border-radius:7px;font-size:12px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.heading h1{font-size:29px;letter-spacing:-1px;margin:5px 0}.muted{color:#829197;font-size:12px;line-height:1.6}.tabs{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}.tab{background:#e8efed;color:#567079}.tab.active{background:#214f60;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:16px}.metric span{font-size:10px;color:#819197;text-transform:uppercase;font-weight:750}.metric strong{display:block;font-size:28px;margin:9px 0 3px}.metric small{color:#86969a;font-size:10px}.panel{margin-top:14px}.panel h2{font-size:17px;margin:0}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:11px 8px;border-bottom:1px solid #edf1f0}th{font-size:10px;color:#819096;text-transform:uppercase}.roster{display:grid}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f0;gap:12px}.person{display:grid;gap:3px}.person small{color:#849298;font-size:10px}.marks{display:flex;gap:5px}.mark{background:#f0f4f3;padding:7px 9px}.mark.on{background:#dff1e8;color:#206a55}.mark.absent.on{background:#ffebe8;color:#9c3e34}.mark.late.on{background:#fff4dd;color:#80611d}.panel+.panel{margin-top:14px}.bar{height:6px;background:#ecf1ef;border-radius:99px;margin-top:8px}.bar i{display:block;height:100%;background:#308d79;border-radius:99px}.subject{border:1px solid #e8efec;border-radius:9px;padding:13px}.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions{display:flex;gap:8px;align-items:center}.footer{text-align:center;padding:20px;color:#89989b;font-size:10px}.hidden{display:none!important}.form-note{font-size:11px;color:#7c8b91;margin:8px 0}
@media(max-width:760px){.login{grid-template-columns:1fr;padding:22px;gap:10px}.login h1{font-size:42px}.card{max-width:500px;width:100%;margin:auto}.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 13px}.heading{align-items:start;flex-direction:column}.form-grid{grid-template-columns:1fr 1fr}.subjects{grid-template-columns:1fr 1fr}}@media(max-width:500px){.form-grid,.subjects{grid-template-columns:1fr}.user-name{display:none}.grid{gap:7px}.metric{padding:12px}.metric strong{font-size:23px}.panel{padding:14px}.row{align-items:start;flex-direction:column}.marks{margin-left:auto}}
</style></head><body><div id="app"></div><script>
(()=>{
const app=document.getElementById('app');let user=null,view='home',classes=[],roster=[],marks={},currentAssignment=null,currentSession=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cookie=n=>document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.slice(n.length+1);
async function csrf(){const r=await fetch('/api/auth/csrf',{credentials:'include'});if(!r.ok)throw Error('Unable to start secure session.');const j=await r.json();return j.token||decodeURIComponent(cookie('XSRF-TOKEN')||'')}
async function api(path,opts={}){const method=(opts.method||'GET').toUpperCase(),headers=new Headers(opts.headers||{});if(opts.body)headers.set('Content-Type','application/json');if(!['GET','HEAD','OPTIONS'].includes(method))headers.set('X-XSRF-TOKEN',await csrf());const r=await fetch('/api'+path,{...opts,method,headers,credentials:'include'});if(!r.ok){let e={};try{e=await r.json()}catch{}throw Error(e.error||`Request failed (${r.status})`)}if(r.status===204)return null;const type=r.headers.get('content-type')||'';return type.includes('text/csv')?r.blob():r.json()}
function notice(message,kind='success'){const el=document.getElementById('notice');if(el){el.className=kind;el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),4500)}}
function login(error=''){app.innerHTML=`<main class="login"><section><div class="brand">Campus<span>Attend</span></div><p class="eyebrow" style="margin-top:70px">COLLEGE ATTENDANCE</p><h1>Make every class count.</h1><p>Secure attendance for administrators, faculty, and students. Your records are stored in the college database.</p></section><section class="card"><p class="eyebrow">WELCOME</p><h2>Sign in</h2><p class="muted">Use the account provided by your administrator.</p><form id="login"><label class="field">Email<input name="email" type="email" autocomplete="username" required></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>${error?`<p class="error">${esc(error)}</p>`:''}<button class="primary full">Sign in →</button></form><p class="form-note">For the seeded local demo credentials, see README.md.</p></section></main>`;
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{user=await api('/auth/login',{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})});view='home';render()}catch(x){login(x.message)}}}
function shell(title,sub,body){app.innerHTML=`<div class="wrap"><header class="top"><div class="brand">Campus<span>Attend</span></div><div class="user"><span class="pill">${esc(user.role.toLowerCase())}</span><span class="user-name">${esc(user.displayName)}</span><button class="quiet" id="signout">Sign out</button></div></header><main class="content"><div class="heading"><div><p class="eyebrow">${esc(user.role)} WORKSPACE</p><h1>${esc(title)}</h1><p class="muted">${esc(sub)}</p></div></div><div id="notice" class="hidden"></div>${user.mustChangePassword?`<section class="panel"><h2>Change temporary password</h2><form id="password-form" class="form-grid"><label class="field">Current password<input name="currentPassword" type="password" required></label><label class="field">New password (12+ characters)<input name="newPassword" type="password" minlength="12" required></label><button class="primary">Update password</button></form></section>`:''}${nav()}${body}</main><footer class="footer">CampusAttend · Attendance is tied to a class session · Times shown in institution timezone</footer></div>`;document.getElementById('signout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}user=null;login()};const pf=document.getElementById('password-form');if(pf)pf.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(pf));try{await api('/auth/password',{method:'POST',body:JSON.stringify(f)});user.mustChangePassword=false;notice('Password updated.')}catch(x){notice(x.message,'error')}};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}
function nav(){const v=user.role==='ADMIN'?[['home','Overview'],['people','People'],['classes','Classes'],['reports','Reports']]:user.role==='FACULTY'?[['home','Overview'],['take','Take attendance'],['reports','Reports']]:[['home','Summary'],['history','History']];return `<nav class="tabs">${v.map(([id,label])=>`<button class="tab ${view===id?'active':''}" data-view="${id}">${label}</button>`).join('')}</nav>`}
const metric=(label,val,small)=>`<article class="metric"><span>${label}</span><strong>${val??'—'}</strong><small>${small}</small></article>`;
function table(cols,rows){return `<div class="table-wrap"><table><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map(x=>`<td>${x??'—'}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="muted">No records yet.</td></tr>`}</tbody></table></div>`}
async function render(){if(!user){login();return}try{if(user.role==='ADMIN')await admin();else if(user.role==='FACULTY')await faculty();else await student()}catch(e){shell('Unable to load this view','Check the service and try again.',`<p class="error">${esc(e.message)}</p><button class="secondary" onclick="location.reload()">Reload</button>`)}}
async function admin(){if(view==='people'){const users=await api('/admin/users');shell('People','Create and manage campus accounts.',`<section class="panel"><h2>Create user account</h2><form id="user-form" class="form-grid"><label class="field">Full name<input name="displayName" required></label><label class="field">Email<input name="email" type="email" required></label><label class="field">Role<select name="role"><option>STUDENT</option><option>FACULTY</option><option>ADMIN</option></select></label><label class="field">Temporary password (12+ characters)<input name="password" type="password" minlength="12" required></label><button class="primary">Create account</button></form></section><section class="panel"><div class="panel-head"><h2>Campus users</h2><span class="pill">${users.length} accounts</span></div>${table(['Name','Email','Role','Status'],users.map(u=>[esc(u.displayName),esc(u.email),esc(u.role),u.active?'Active':'Inactive']))}</section>`);document.getElementById('user-form').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));try{await api('/admin/users',{method:'POST',body:JSON.stringify(f)});notice('User created.');render()}catch(x){notice(x.message,'error')}};return}
if(view==='classes'){const [rows,users,enrollments]=await Promise.all([api('/admin/classes'),api('/admin/users'),api('/admin/enrollments')]);const students=users.filter(u=>u.role==='STUDENT'&&u.active),faculty=users.filter(u=>u.role==='FACULTY'&&u.active);shell('Classes & setup','Create the academic structure, then enroll students and assign faculty.',`<section class="panel"><h2>Create class and subject</h2><form id="class-form" class="form-grid"><label class="field">Department code<input name="departmentCode" value="CS" required></label><label class="field">Department name<input name="departmentName" value="Computer Science" required></label><label class="field">Academic year<input name="yearLabel" value="2026-2027" required></label><label class="field">Year starts<input name="yearStart" type="date" value="2026-06-01" required></label><label class="field">Year ends<input name="yearEnd" type="date" value="2027-05-31" required></label><label class="field">Semester<input name="semester" value="Semester 1" required></label><label class="field">Semester starts<input name="semesterStart" type="date" value="2026-06-01" required></label><label class="field">Semester ends<input name="semesterEnd" type="date" value="2026-12-31" required></label><label class="field">Course code<input name="courseCode" value="BSC-CS" required></label><label class="field">Course name<input name="courseName" value="B.Sc. Computer Science" required></label><label class="field">Section<input name="sectionCode" value="CS-2A" required></label><label class="field">Subject code<input name="subjectCode" value="CS201" required></label><label class="field">Subject name<input name="subjectName" value="Data Structures" required></label><button class="primary">Create class</button></form></section><section class="panel"><div class="panel-head"><h2>Classes and subjects</h2></div>${table(['Course','Section','Semester','Subject','Code'],rows.map(r=>[esc(r.courseName),esc(r.sectionCode),esc(r.semester),esc(r.subjectName),esc(r.subjectCode)]))}</section><section class="panel"><h2>Assign faculty to a class</h2><form id="assign-form" class="form-grid"><label class="field">Faculty<select name="userId" required>${faculty.map(u=>`<option value="${u.id}">${esc(u.displayName)} · ${esc(u.email)}</option>`).join('')}</select></label><label class="field">Class<select name="sectionId" required>${rows.map(r=>`<option value="${r.sectionId}" data-subject="${r.subjectId}">${esc(r.sectionCode)} · ${esc(r.subjectName)}</option>`).join('')}</select></label><input id="subject-id" name="subjectId" type="hidden" value="${rows[0]?.subjectId||''}"><button class="secondary">Assign faculty</button></form></section><section class="panel"><h2>Enroll a student</h2><form id="enroll-form" class="form-grid"><label class="field">Student<select name="studentId" required>${students.map(u=>`<option value="${u.id}">${esc(u.displayName)} · ${esc(u.email)}</option>`).join('')}</select></label><label class="field">Section<select name="sectionId" required>${rows.map(r=>`<option value="${r.sectionId}">${esc(r.sectionCode)} · ${esc(r.courseName)}</option>`).join('')}</select></label><button class="secondary">Enroll student</button></form><p class="form-note">${enrollments.length} enrollment records.</p></section>`);
document.getElementById('class-form').onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.currentTarget));await api('/admin/academic/setup',{method:'POST',body:JSON.stringify(f)});notice('Academic class created.');render()}catch(x){notice(x.message,'error')}};const af=document.getElementById('assign-form');af.onsubmit=async e=>{e.preventDefault();const f=new FormData(af);try{await api('/admin/assignments',{method:'POST',body:JSON.stringify({userId:Number(f.get('userId')),sectionId:Number(f.get('sectionId')),subjectId:Number(f.get('subjectId'))})});notice('Faculty assigned.');render()}catch(x){notice(x.message,'error')}};const section=af.elements.sectionId;section.onchange=()=>{document.getElementById('subject-id').value=section.selectedOptions[0].dataset.subject};const ef=document.getElementById('enroll-form');ef.onsubmit=async e=>{e.preventDefault();const f=new FormData(ef);try{await api('/admin/enrollments',{method:'POST',body:JSON.stringify({studentId:Number(f.get('studentId')),sectionId:Number(f.get('sectionId'))})});notice('Student enrolled.');render()}catch(x){notice(x.message,'error')}};return}
if(view==='reports'){const rows=await api('/reports/attendance');shell('Attendance reports','Review completed session marks and download a CSV.',`<section class="panel"><div class="panel-head"><h2>Attendance detail</h2><button id="csv" class="secondary">Download CSV</button></div>${table(['Date','Course','Section','Subject','Student','Email','Status'],rows.map(r=>[esc(r.sessionDate),esc(r.courseName),esc(r.sectionCode),esc(r.subjectName),esc(r.studentName),esc(r.email),esc(r.status)]))}</section>`);document.getElementById('csv').onclick=async()=>{const b=await api('/reports/attendance.csv');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='attendance-report.csv';a.click();URL.revokeObjectURL(a.href)};return}
const [users,rows]=await Promise.all([api('/admin/users'),api('/admin/classes')]);shell('Campus overview','Manage accounts, courses, and attendance in one place.',`<section class="grid">${metric('Students',users.filter(u=>u.role==='STUDENT'&&u.active).length,'Active student accounts')}${metric('Faculty',users.filter(u=>u.role==='FACULTY'&&u.active).length,'Teaching accounts')}${metric('Class sections',rows.length,'Sections and subjects')}${metric('Users',users.length,'Campus accounts')}</section><section class="panel"><div class="panel-head"><h2>Quick setup</h2><button class="secondary" data-view="classes">Set up classes</button></div><p class="muted">Create students and faculty accounts, add an academic class, then enroll students and assign faculty.</p></section>`)}
async function faculty(){if(view==='reports'){const rows=await api('/reports/attendance');shell('Class reports','Attendance for your assigned classes.',`<section class="panel"><button id="csv" class="secondary">Download CSV</button>${table(['Date','Course','Section','Subject','Student','Status'],rows.map(r=>[esc(r.sessionDate),esc(r.courseName),esc(r.sectionCode),esc(r.subjectName),esc(r.studentName),esc(r.status)]))}</section>`);document.getElementById('csv').onclick=async()=>{const b=await api('/reports/attendance.csv');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='attendance-report.csv';a.click()};return}
classes=await api('/faculty/classes');if(view==='take'){const c=classes.find(x=>x.assignmentId===currentAssignment)||classes[0];if(!c){shell('Take attendance','Record attendance for an assigned class.','<section class="panel muted">No classes are assigned yet. Ask an administrator to assign one.</section>');return}const sessions=await api(`/faculty/classes/${c.assignmentId}/sessions`);shell('Take attendance','Choose a class session and mark every enrolled student.',`<section class="panel"><div class="form-grid"><label class="field">Class<select id="class-choice">${classes.map(x=>`<option value="${x.assignmentId}" ${x.assignmentId===c.assignmentId?'selected':''}>${esc(x.sectionCode)} · ${esc(x.subjectName)}</option>`).join('')}</select></label><label class="field">Date<input id="class-date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field">Session label<input id="class-label" value="Lecture ${sessions.length+1}"></label></div><div class="actions"><button id="open-session" class="secondary">Open session</button><select id="saved-session"><option value="">Continue saved session</option>${sessions.map(s=>`<option value="${s.id}">${esc(s.sessionDate)} · ${esc(s.sessionLabel)} · ${esc(s.state)}</option>`).join('')}</select></div><div id="roster"></div></section>`);document.getElementById('class-choice').onchange=e=>{currentAssignment=Number(e.target.value);render()};document.getElementById('open-session').onclick=async()=>{try{const out=await api(`/faculty/classes/${c.assignmentId}/sessions`,{method:'POST',body:JSON.stringify({sessionDate:document.getElementById('class-date').value,sessionLabel:document.getElementById('class-label').value})});currentSession=out.id;await loadRoster(c.assignmentId,out.id);notice('Session ready. Mark every student and save.')}catch(e){notice(e.message,'error')}};document.getElementById('saved-session').onchange=async e=>{if(e.target.value){currentSession=Number(e.target.value);await loadRoster(c.assignmentId,currentSession)}};return}
shell('Faculty overview','Your assigned teaching sections.',`<section class="grid">${metric('Assigned classes',classes.length,'Current assignments')}${metric('Workspace','Ready','Attendance saves to MySQL')}${metric('Student identity','Scoped','Only enrolled rosters are shown')}${metric('Timezone','Local','Class dates are calendar dates')}</section><section class="panel"><h2>Your classes</h2>${table(['Course','Section','Subject','Semester'],classes.map(c=>[esc(c.courseName),esc(c.sectionCode),esc(c.subjectName),esc(c.semester)]))}<button class="primary" data-view="take">Take attendance</button></section>`)}
async function loadRoster(assignmentId,sessionId){const [r,s]=await Promise.all([api(`/faculty/classes/${assignmentId}/roster`),api(`/faculty/sessions/${sessionId}`)]);roster=r;currentSession=sessionId;let expectedVersion=Number(s.version||0);marks=Object.fromEntries(r.map(u=>[u.studentId,s.attendance?.find(m=>m.studentId===u.studentId)?.status||'PRESENT']));const area=document.getElementById('roster');area.innerHTML=`<h2 style="margin-top:22px">Class roster · ${roster.length} students</h2><div class="roster">${roster.map(u=>`<div class="row"><div class="person"><b>${esc(u.displayName)}</b><small>${esc(u.email)}</small></div><div class="marks">${['PRESENT','ABSENT','LATE'].map(x=>`<button class="mark ${x.toLowerCase()} ${marks[u.studentId]===x?'on':''}" data-user="${u.studentId}" data-mark="${x}">${x[0]+x.slice(1).toLowerCase()}</button>`).join('')}</div></div>`).join('')}</div><div class="panel-head" style="margin-top:16px"><span class="muted">Review marks before saving.</span><button id="save-attendance" class="primary">Save attendance</button></div>`;area.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>{marks[b.dataset.user]=b.dataset.mark;area.querySelectorAll(`[data-user="${b.dataset.user}"]`).forEach(x=>x.classList.remove('on'));b.classList.add('on')});document.getElementById('save-attendance').onclick=async()=>{try{await api(`/faculty/sessions/${sessionId}/attendance`,{method:'PUT',body:JSON.stringify({expectedVersion,records:roster.map(u=>({studentId:u.studentId,status:marks[u.studentId]}))})});expectedVersion++;notice('Attendance saved successfully.')}catch(e){notice(e.message,'error')}}}
async function student(){if(view==='history'){const h=await api('/student/attendance/history?page=0&size=100');shell('Attendance history','Your completed class sessions.',`<section class="panel">${table(['Date','Session','Subject','Code','Status'],h.content.map(r=>[esc(r.sessionDate),esc(r.sessionLabel),esc(r.subjectName),esc(r.subjectCode),esc(r.status)]))}</section>`);return}const s=await api('/student/attendance/summary');shell('Your attendance','Only your own saved attendance is shown here.',`<section class="grid">${metric('Overall attendance',s.percentage==null?'—':s.percentage+'%',`Across ${s.total} completed sessions`)}${metric('Present',s.present,'Marked present')}${metric('Late',s.late,'Counts as attended')}${metric('Absent',s.absent,'Marked absent')}</section><p class="muted">${esc(s.formula)}</p><section class="panel"><h2>By subject</h2><div class="subjects">${s.subjects.length?s.subjects.map(x=>`<article class="subject"><b>${esc(x.subjectName)}</b><p class="muted">${esc(x.subjectCode)} · ${x.attended}/${x.total} attended</p><div class="bar"><i style="width:${x.percentage||0}%"></i></div><small>${x.percentage}%</small></article>`).join(''):'<p class="muted">No completed sessions yet.</p>'}</div></section><section class="panel"><button class="secondary" data-view="history">View attendance history</button></section>`)}
api('/auth/me').then(me=>{user=me;render()}).catch(()=>login());
})();
</script></body></html>
